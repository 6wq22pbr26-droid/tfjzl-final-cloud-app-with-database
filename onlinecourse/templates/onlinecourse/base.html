{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Online Course{% endblock %}</title><link rel="stylesheet" href="{% static 'onlinecourse/bootstrap.min.css' %}"><style>body{background:#f5f7fa;color:#22364a}main{max-width:1000px;margin:35px auto}.navbar{background:#243f57;color:white}.navbar a{color:white}.card{border:1px solid #dde4e9;border-radius:10px;margin:18px 0}.card-header{background:#eaf0f5}.exam-choice{display:block;padding:12px;border:1px solid #d9e1e7;border-radius:6px;margin:8px 0;background:white}.result-choice{padding:10px 14px;margin:6px 0;border-radius:5px}.score{font-size:24px;font-weight:700}.muted{color:#738292}</style></head><body><nav class="navbar px-4"><a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course</a><div>{% if user.is_authenticated %}{{ user.first_name|default:user.username }} · <a href="{% url 'onlinecourse:logout' %}">Log out</a>{% else %}<a href="{% url 'onlinecourse:login' %}">Log in</a>{% endif %}</div></nav><main class="container">{% block content %}{% endblock %}</main></body></html>
